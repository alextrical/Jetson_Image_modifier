name: Connect to Github runner with SSH

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Disable man-db to make package install and removal faster
        run: |
          echo 'set man-db/auto-update false' | sudo debconf-communicate >/dev/null
          sudo dpkg-reconfigure man-db

      - name: Free Disk Space
        # uses: jlumbroso/free-disk-space@main
        uses: jayllyz/free-disk-space@perf/use-rmz
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - uses: actions/checkout@v2
      - name: Setup upterm session for debugging
        uses: owenthereal/action-upterm@v1
        with:
          limit-access-to-actor: true           # Only the workflow initiator can connect